name: news-system

services:
    # Существующий микросервис notification
    app:
        build:
            context: .
            dockerfile: Dockerfile
        image: notification:latest
        container_name: ms-notification
        ports:
            - "8080:8080"
        env_file:
            - .env
        environment:
            MEMCACHED_HOST: "localhost"
            MEMCACHED_PORT: 11211
        depends_on:
            - db
            - memcached

    # Существующая база данных PostgreSQL
    db:
        image: postgres:14.2
        hostname: postgres
        container_name: postgres-container
        restart: unless-stopped
        env_file:
            - .env
        ports:
            - "5432:5432"
        command: [ "postgres", "-c", "log_statement=all", "-c", "wal_level=logical",
                   "-c", "max_replication_slots=4" ]


    # Memcached
    memcached:
        image: memcached:latest
        container_name: memcached-notification
        ports:
            - "11211:11211"