databaseChangeLog:
    -   changeSet:
            id: create-table-news
            author: daniil
            preConditions:
                -   onFail: MARK_RAN
                -   not:
                        tableExists:
                            tableName: newz
            changes:
                -   createTable:
                        tableName: newz
                        columns:
                            -   column:
                                    name: id
                                    type: bigserial
                                    constraints:
                                        primaryKey: true
                            -   column:
                                    name: time
                                    type: timestamp
                                    constraints:
                                        nullable: false
                            -   column:
                                    name: keywords
                                    type: text
                                    constraints:
                                        nullable: false
                            -   column:
                                    name: text
                                    type: text
                                    constraints:
                                        nullable: false
                                        unique: true
                            -   column:
                                    name: is_sent
                                    type: BOOLEAN
                                    defaultValueBoolean: false
                                    constraints:
                                        nullable: false
