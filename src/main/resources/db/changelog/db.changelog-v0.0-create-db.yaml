databaseChangeLog:
    -   changeSet:
            id: create-database-news
            author: daniil
            preConditions:
                -   onFail: MARK_RAN
                -   sqlCheck:
                        expectedResult: 0
                        sql: SELECT COUNT(*) FROM pg_database WHERE datname = 'new'
            changes:
                -   sql:
                        dbms: postgresql
                        sql: CREATE DATABASE new;